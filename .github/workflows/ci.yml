name: CI

# Runs on pull requests and on pushes to the default branch. `main` was left
# un-deployable once already because a bad merge resolution reached it with
# nothing checking that the project still compiled.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`, so the lockfile is what is tested
      # and a drifted lockfile fails here instead of on Vercel.
      - name: Install dependencies
        run: npm ci

      # First, because it produces the clearest message when something is wrong.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Covers the pure libraries only -- coverage rules, schedule dates, iCal
      # generation and identity matching. Nothing here needs Postgres or Clerk,
      # which is exactly why these are the parts worth pinning down.
      - name: Test
        run: npm test

      # No secrets: the app is built with placeholder-free config, and any route
      # needing a key falls back at build time. This is the check that would
      # have caught the merge that broke the deployment.
      - name: Build
        run: npm run build
